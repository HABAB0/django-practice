{% extends "base.html" %}

{% block content %}
    <div class="login">
        {% if form.errors %}
            <p>Your username and password didn't match. Please try again.</p>
        {% endif %}
        <form method="post" action="{% url 'registration' %}" class="login__content">
            {% csrf_token %}
            <table class="login__form">
               {{ form.as_table }}
            </table>
            <input type="submit" value="Зарегистрироваться" class=login__button>
        </form>
    </div>
{% endblock %}
